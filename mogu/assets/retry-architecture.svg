<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">Implemented expiry-batch candidate</title><desc id="desc">MySQL owns inventory, durable attempts and execution permissions. Four workers call the external HTTP provider outside transactions. Webhooks only signal authenticated queries. Expiry batches up to32 held reservations in guard order and returns original buckets.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#24776b" /></marker></defs><rect width="1200" height="770" fill="#fbfaf6" /><g font-family="sans-serif" fill="#183c37"><rect x="25" y="65" width="225" height="115" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="41" y="96" font-size="22" font-weight="bold">Logical client</text><text x="41" y="127" font-size="18">Same reservation / key</text><text x="41" y="154" font-size="18">Original 10s deadline</text><rect x="330" y="65" width="310" height="155" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="346" y="96" font-size="22" font-weight="bold">HTTP application</text><text x="346" y="127" font-size="18">Admission 24; DB pool 48</text><text x="346" y="154" font-size="18">Reserve / pay / cancel</text><text x="346" y="181" font-size="18">202 is acceptance only</text><rect x="750" y="30" width="420" height="690" rx="10" fill="#f1f5f3" stroke="#8aaea1" /><text x="766" y="61" font-size="22" font-weight="bold">MySQL: durable authority</text><rect x="775" y="100" width="370" height="135" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="791" y="131" font-size="22" font-weight="bold">Inventory transaction</text><text x="791" y="162" font-size="18">User guard + reservation</text><text x="791" y="189" font-size="18">16 original inventory buckets</text><text x="791" y="216" font-size="18">HELD / PAYMENT_PENDING</text><rect x="775" y="265" width="370" height="180" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="791" y="296" font-size="22" font-weight="bold">Payment execution</text><text x="791" y="327" font-size="18">Global pending bound 256</text><text x="791" y="354" font-size="18">Attempts + operations + keys</text><text x="791" y="381" font-size="18">ready_order_idx</text><text x="791" y="408" font-size="18">Same due-time ordering</text><rect x="775" y="480" width="370" height="155" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="791" y="511" font-size="22" font-weight="bold">Signals and review</text><text x="791" y="542" font-size="18">Durable inbox bound 100000</text><text x="791" y="569" font-size="18">dirty / signal_seen</text><text x="791" y="596" font-size="18">Persistent manual-review latch</text><rect x="25" y="340" width="225" height="155" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="41" y="371" font-size="22" font-weight="bold">HTTP PG</text><text x="41" y="402" font-size="18">Approval / cancel facts</text><text x="41" y="429" font-size="18">Independent call ledger</text><text x="41" y="456" font-size="18">Idempotent commands</text><rect x="330" y="340" width="310" height="170" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="346" y="371" font-size="22" font-weight="bold">Bounded workers: 4</text><text x="346" y="402" font-size="18">Claim; commit permission</text><text x="346" y="429" font-size="18">HTTP outside DB transaction</text><text x="346" y="456" font-size="18">Validate fact; DB commit</text><text x="346" y="483" font-size="18">Periodic query safety net</text><rect x="330" y="580" width="310" height="140" rx="10" fill="#e8f2ed" stroke="#8aaea1" /><text x="346" y="611" font-size="22" font-weight="bold">Expiry transaction</text><text x="346" y="642" font-size="18">At most32 due reservations</text><text x="346" y="669" font-size="18">Ordered guards; recheck HELD</text><text x="346" y="696" font-size="18">Return original buckets once</text><path d="M250 120 H330" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="270" y="105" font-size="16">HTTP</text><path d="M640 125 H750" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="680" y="108" font-size="16">tx</text><path d="M640 385 H750" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="648" y="368" font-size="16">claim / arm</text><path d="M640 462 H750" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="650" y="485" font-size="16">apply fact</text><path d="M330 405 H250" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)" /><text x="263" y="388" font-size="16">HTTP</text><path d="M250 458 H290 V185 H330" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5" /><text x="279" y="322" font-size="16" transform="rotate(-90 279 322)">webhook: query signal only</text><path d="M640 645 H750" fill="none" stroke="#24776b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="647" y="670" font-size="16">one commit</text><text x="25" y="755" font-size="17">선점 인덱스·만료 배치 구조. 외부 HTTP 대기 중에는 DB 트랜잭션을 유지하지 않는다.</text></g></svg>
