<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">모구시장 권위와 프로세스 경계</title><desc id="d">API와 복구 worker는 앱 MySQL에 기록한다. 별도 PG는 HTTP로 호출하며 SQLite 원장을 소유한다. 감사 하네스만 두 원장을 읽는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087c70"/></marker></defs><rect width="900" height="470" fill="#fbfaf6"/><g font-family="sans-serif" fill="#14292b" font-size="18"><text x="30" y="36" font-weight="bold">한 노트북 · DB 트랜잭션과 외부 효과는 서로 다른 경계</text><g fill="#e8f2ed" stroke="#087c70"><rect x="30" y="80" width="170" height="85" rx="10"/><rect x="280" y="80" width="240" height="85" rx="10"/><rect x="630" y="80" width="235" height="85" rx="10"/><rect x="280" y="255" width="240" height="100" rx="10"/><rect x="630" y="255" width="235" height="100" rx="10"/></g><text x="55" y="115">합성 사용자</text><text x="55" y="145">요청 원장</text><text x="304" y="115">Spring API + worker</text><text x="304" y="145">승인 허가 → HTTP</text><text x="650" y="115">독립 HTTP PG</text><text x="650" y="145">승인 · 조회 · 취소</text><text x="302" y="290">MySQL 8.4</text><text x="302" y="320">재고 · 의사 · 내부 구매</text><text x="650" y="290">SQLite WAL / FULL</text><text x="650" y="320">외부 승인 · 취소 효과</text><g fill="none" stroke="#087c70" stroke-width="2" marker-end="url(#a)"><path d="M200 120H275"/><path d="M520 108H625"/><path d="M630 148H525"/><path d="M395 165V250"/><path d="M740 165V250"/></g><text x="532" y="94" font-size="14">HTTP 호출</text><text x="532" y="173" font-size="14">webhook</text><text x="410" y="208" font-size="14">짧은 로컬 트랜잭션</text><text x="750" y="208" font-size="14">별도 영속 효과</text><path d="M395 355V405H740V355" fill="none" stroke="#536768" stroke-dasharray="5 5"/><text x="322" y="440" font-weight="bold">독립 감사: 요청 원장 + 앱 DB + PG 효과 원장</text></g></svg>
