<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="t"><title id="t">늦은 승인과 취소 의사가 경합할 때의 안전한 반환</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087c70"/></marker></defs><rect width="900" height="590" fill="#fbfaf6"/><g font-family="sans-serif" fill="#14292b" font-size="17"><text x="30" y="35" font-size="20" font-weight="bold">lease가 끝났어도 과거 worker는 외부 요청을 보낼 수 있다</text><text x="70" y="80">오래된 worker</text><text x="315" y="80">앱 DB / 새 worker</text><text x="650" y="80">독립 PG</text><g stroke="#aabdb8" stroke-dasharray="4 5"><path d="M130 100V540M400 100V540M720 100V540"/></g><g stroke="#087c70" stroke-width="2" fill="none" marker-end="url("#a")"><path d="M130 130H395"/><path d="M130 290H715"/><path d="M400 350H715"/><path d="M720 395H405"/><path d="M400 445H715"/><path d="M720 490H405"/></g><text x="165" y="120">ARMED 커밋</text><rect x="55" y="160" width="150" height="100" fill="#fff2d9" rx="8"/><text x="76" y="195">전송 직전 정지</text><text x="76" y="225">lease 만료</text><text x="425" y="195">취소 의사 커밋</text><text x="425" y="225">NOT_FOUND → 점유 유지</text><text x="250" y="280">복귀 후 동일 승인 키로 요청</text><text x="455" y="340">조회</text><text x="455" y="385">승인 사실 관측</text><text x="455" y="435">영속 취소 operation · 전액 취소</text><text x="455" y="480">CANCELED + 잔액 0 확인</text><rect x="300" y="520" width="530" height="44" fill="#e8f2ed" rx="8"/><text x="325" y="549">CANCELLED 커밋 · 재고 +1 · 소유 guard만 해제</text></g></svg>
