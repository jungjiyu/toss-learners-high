<svg xmlns="http://www.w3.org/2000/svg" width="400" height="534" viewBox="0 0 400 534" role="img" aria-labelledby="title"><title id="title">후속 실행 권한 선점 경합</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="400" height="534" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="24" y="38" font-size="21" font-weight="700" text-anchor="start">실패 시도 하나, 후속 실행 하나</text><rect x="24" y="68" width="168" height="100" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="108.0" y="98" font-size="19" font-weight="650" text-anchor="middle">수동 재시도</text><text x="108.0" y="125" font-size="16" font-weight="400" text-anchor="middle">같은 설정</text><text x="108.0" y="149" font-size="16" font-weight="400" text-anchor="middle">요청 ID 1</text><rect x="208" y="68" width="168" height="100" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="292.0" y="98" font-size="19" font-weight="650" text-anchor="middle">Agent 제안</text><text x="292.0" y="125" font-size="16" font-weight="400" text-anchor="middle">변경한 설정</text><text x="292.0" y="149" font-size="16" font-weight="400" text-anchor="middle">요청 ID 2</text><path d="M108 168V201H174V227" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 168V201H226V227" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="234" width="352" height="104" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="200.0" y="264" font-size="19" font-weight="650" text-anchor="middle">원래 실패한 시도의 DB 레코드</text><text x="200.0" y="291" font-size="16" font-weight="400" text-anchor="middle">후속 실행 권한이 비어 있을 때만</text><text x="200.0" y="315" font-size="16" font-weight="400" text-anchor="middle">조건부 갱신으로 선점</text><path d="M174 338V364H108V390" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><path d="M226 338V364