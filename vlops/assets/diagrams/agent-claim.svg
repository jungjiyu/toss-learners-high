<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title"><title id="title">수동 재시도와 Agent의 후속 실행 권한 경합</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="800" height="470" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="30" y="40" font-size="22" font-weight="700" text-anchor="start">서로 다른 요청이 같은 실패 시도에서 경합</text><rect x="30" y="74" width="330" height="86" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="195.0" y="104" font-size="19" font-weight="650" text-anchor="middle">사용자의 재시도</text><text x="195.0" y="131" font-size="16" font-weight="400" text-anchor="middle">기존 설정 · 요청 ID 1</text><rect x="440" y="74" width="330" height="86" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="605.0" y="104" font-size="19" font-weight="650" text-anchor="middle">검증을 통과한 Agent 제안</text><text x="605.0" y="131" font-size="16" font-weight="400" text-anchor="middle">변경한 설정 · 요청 ID 2</text><path d="M195 160V190H350V216" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 160V190H450V216" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="222" width="390" height="90" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="400.0" y="252" font-size="19" font-weight="650" text-anchor="middle">원래 실패한 시도의 DB 레코드</text><text x="400.0" y="279" font-size="16" font-weight="400" text-anchor="middle">후속 실행 권한이 비어 있을 때만 선점</text><path d="M350 312V340H195V366" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 312V340H605V366" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="30" y="372" width="330" height="74" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="195.0" y="402" font-size="19" font-weight="650" text-anchor="middle">수동 재시도가 먼저 선점</text><text x="195.0" y="429" font-size="16" font-weight="400" text-anchor="middle">후속 시도 1개 생성</text><rect x="440" y="372" width="330" height="74" rx="10" fill="#fff3e6" stroke="#e6c6a4"/><text x="605.0" y="402" font-size="19" font-weight="650" text-anchor="middle">Agent는 선점 실패</text><text x="605.0" y="429" font-size="16" font-weight="400" text-anchor="middle">추가 평가를 생성하지 않음</text></g></svg>