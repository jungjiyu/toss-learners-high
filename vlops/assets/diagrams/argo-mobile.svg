<svg xmlns="http://www.w3.org/2000/svg" width="400" height="625" viewBox="0 0 400 625" role="img" aria-labelledby="title desc"><title id="title">Argo 실행 구조 · 모바일</title><desc id="desc">Argo와 Runner Pod는 Kubernetes에 있으며, Adapter가 별도 GPU 환경의 Run을 실행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="400" height="625" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">02  ARGO</text><text x="28" y="64" class="title" text-anchor="start">Argo와 외부 GPU 환경의 연결</text><rect x="10" y="270" width="180" height="320" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="28" y="296" class="group-label" text-anchor="start">KUBERNETES</text><rect x="210" y="439" width="180" height="151" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="228" y="465" class="group-label" text-anchor="start">외부 GPU 환경</text><rect x="20" y="110" width="155" height="80" rx="9" class="neutral" stroke-width="1.4"/><text x="97.5" y="142.5" class="label" text-anchor="middle">요청</text><text x="97.5" y="172.5" class="sub" text-anchor="middle">Daemon · 사용자</text><rect x="225" y="110" width="155" height="80" rx="9" class="owned" stroke-width="1.4"/><text x="302.5" y="142.5" class="label" text-anchor="middle">Control Server</text><text x="302.5" y="172.5" class="sub" text-anchor="middle">계획 검증 · 변환</text><rect x="225" y="275" width="155" height="75" rx="9" class="neutral" stroke-width="1.4"/><text x="302.5" y="305.0" class="label" text-anchor="middle">VLOps DB</text><text x="302.5" y="335.0" class="sub" text-anchor="middle">정의 · 실행</text><rect x="25" y="325" width="150" height="80" rx="9" class="engine" stroke-width="1.4"/><text x="100.0" y="357.5" class="label" text-anchor="middle">Argo</text><text x="100.0" y="387.5" class="sub" text-anchor="middle">다음 step 선택</text><rect x="25" y="495" width="150" height="75" rx="9" class="owned" stroke-width="1.4"/><text x="100.0" y="527.5" class="label" text-anchor="middle">Runner Pod</text><text x="100.0" y="550.5" class="label" text-anchor="middle">Adapter</text><rect x="225" y="495" width="155" height="75" rx="9" class="neutral" stroke-width="1.4"/><text x="302.5" y="525.0" class="label" text-anchor="middle">원격 Run</text><text x="302.5" y="555.0" class="sub" text-anchor="middle">서빙 · 평가</text><path d="M175 150 H225" class="line" marker-end="url(#arrow)" /><text x="200" y="133" class="edge" text-anchor="middle">YAML</text><path d="M270 190 V237 H160 V303 H100 V325" class="line" marker-end="url(#arrow)" /><text x="172" y="222" class="edge" text-anchor="middle">Workflow 제출</text><path d="M325 190 V275" class="line" marker-end="url(#arrow)" /><text x="340" y="239" class="edge" text-anchor="start">저장</text><path d="M72 405 V495" class="line" marker-end="url(#arrow)" /><text x="61" y="455" class="edge" text-anchor="end">생성</text><path d="M139 495 V405" class="line data" marker-end="url(#arrow)" /><text x="150" y="455" class="edge" text-anchor="start">결과</text><path d="M175 516 H225" class="line" marker-end="url(#arrow)" /><text x="200" y="500" cla