<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title desc"><title id="title">Argo 단계의 실행 구조</title><desc id="desc">Control Server가 계획을 Argo에 제출한다. Kubernetes의 Argo가 Runner Pod를 실행하고 결과에 따라 다음 step을 선택한다. Runner의 Adapter는 외부 GPU 플랫폼을 호출한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="800" height="610" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">02  ARGO</text><text x="28" y="64" class="title" text-anchor="start">Argo와 외부 GPU 환경의 연결</text><rect x="30" y="265" width="335" height="300" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="48" y="291" class="group-label" text-anchor="start">KUBERNETES</text><rect x="485" y="380" width="285" height="185" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="503" y="406" class="group-label" text-anchor="start">외부 GPU 환경</text><rect x="30" y="115" width="185" height="76" rx="9" class="neutral" stroke-width="1.4"/><text x="122.5" y="145.5" class="label" text-anchor="middle">요청</text><text x="122.5" y="175.5" class="sub" text-anchor="middle">Daemon · 사용자</text><rect x="300" y="115" width="210" height="76" rx="9" class="owned" stroke-width="1.4"/><text x="405.0" y="145.5" class="label" text-anchor="middle">Control Server</text><text x="405.0" y="175.5" class="sub" text-anchor="middle">계획 검증 · 변환</text><rect x="600" y="115" width="170" height="76" rx="9" class="neutral" stroke-width="1.4"/><text x="685.0" y="145.5" class="label" text-anchor="middle">VLOps DB</text><text x="685.0" y="175.5" class="sub" text-anchor="middle">정의 · 실행</text><rect x="60" y="315" width="275" height="82" rx="9" class="engine" stroke-width="1.4"/><text x="197.5" y="348.5" class="label" text-anchor="middle">Argo Workflows</text><text x="197.5" y="378.5" class="sub" text-anchor="middle">다음 step 선택</text><rect x="60" y="465" width="275" height="70" rx="9" class="owned" stroke-width="1.4"/><text x="197.5" y="492.5" class="label" text-anchor="middle">Runner · Adapter</text><text x="197.5" y="522.5" class="sub" text-anchor="middle">도구 실행 · GPU 연동</text><rect x="510" y="465" width="235" height="70" rx="9" class="neutral" stroke-width="1.4"/><text x="627.5" y="492.5" class="label" text-anchor="middle">원격 Run</text><text x="627.5" y="522.5" class="sub" text-anchor="middle">서빙 · 평가</text><path d="M215 153 H300" class="line" marker-end="url(#arrow)" /><text x="257" y="137" class="edge" text-anchor="middle">YAML</text><path d="M510 153 H600" class="line" marker-end="url(#arrow)" /><text x="555" y="137" class="edge" text-anchor="middle">저장</text><path d="M405 191 V235 H197 V315" class="line" marker-end="url(#arrow)" /><text x="300" y="222" class="edge" text-anchor="middle">Workflow 제출</text><path d="M140 397 V465" class="line" marker-end="url(#arrow)" /><text x="127" y="438" class="edge" text-anchor="end">Pod 생성</text><path d="M275 465 V397" class="line data" marker-end="url(#arrow)" /><text x="288" y="438" class="edge" text-anchor="start">결과</text><path d="M335 483 H510" class="line" marker-end="url(#arrow)" /><text x="422" y="466" class="edge" text-anchor="middle">Run API</text><path d="M510 519 H335" class="line data" marker-end="url(#arrow)" /><text x="422" y="548" class="edge" text-anchor="middle">상태·출력</text><path d="M35 585 H65" class="line"/><path d="M250 585 H280" class="line data"/><text x="75" y="591" class="sub" text-anchor="start">요청·실행 호출</text><text x="290" y="591" class="sub" text-anchor="start">결과 반환</text></svg>