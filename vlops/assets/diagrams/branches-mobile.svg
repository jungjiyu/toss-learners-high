<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc"><title id="title">독립 분기의 병렬 실행 · 모바일</title><desc id="desc">S에서 A와 B로 분기한다. C는 A만 기다리며 B는 A의 실패와 무관하게 계속된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="400" height="500" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">DAG</text><text x="28" y="64" class="title" text-anchor="start">서빙 결과를 공유하는 병렬 평가</text><rect x="110" y="110" width="180" height="75" rx="9" class="owned" stroke-width="1.4"/><text x="200.0" y="140.0" class="label" text-anchor="middle">서빙 S</text><text x="200.0" y="170.0" class="sub" text-anchor="middle">endpoint 준비</text><rect x="20" y="265" width="165" height="75" rx="9" class="owned" stroke-width="1.4"/><text x="102.5" y="295.0" class="label" text-anchor="middle">평가 A</text><text x="102.5" y="325.0" class="sub" text-anchor="middle">S의 endpoint 사용</text><rect x="215" y="265" width="165" height="75" rx="9" class="owned" stroke-width="1.4"/><text x="297.5" y="295.0" class="label" text-anchor="middle">평가 B</text><text x="297.5" y="325.0" class="sub" text-anchor="middle">S의 endpoint 사용</text><rect x="20" y="415" width="165" height="65" rx="9" class="engine" stroke-width="1.4"/><text x="102.5" y="440.0" class="label" text-anchor="middle">후속 C</text><text x="102.5" y="470.0" class="sub" text-anchor="middle">A 결과 사용</text><path d="M200 185 V225 H102 V265" class="line" marker-end="url(#arrow)" /><path d="M200 225 H297 V265" class="line" marker-end="url(#arrow)" /><circle cx="200" cy="225" r="3" fill="#506779"/><path d="M102 340 V415" class="line" marker-end="url(#arrow)" /><text x="117" y="383" class="edge" text-anchor="start">A 성공</text><text x="297" y="385" class="sub" text-anchor="middle">A가 실패해도</text><text x="297" y="408" class="sub" text-anchor="middle">계속 실행</text></svg>