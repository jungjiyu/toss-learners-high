<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">서빙 결과를 공유하는 평가 분기</title><desc id="desc">서빙 S가 준비되면 A와 B를 함께 시작한다. C는 A만 기다린다. A가 실패해도 B는 계속 실행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="800" height="420" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">DAG</text><text x="28" y="64" class="title" text-anchor="start">서빙 결과를 공유하는 병렬 평가</text><rect x="35" y="210" width="185" height="85" rx="9" class="owned" stroke-width="1.4"/><text x="127.5" y="245.0" class="label" text-anchor="middle">서빙 S</text><text x="127.5" y="275.0" class="sub" text-anchor="middle">endpoint 준비</text><rect x="330" y="125" width="170" height="80" rx="9" class="owned" stroke-width="1.4"/><text x="415.0" y="157.5" class="label" text-anchor="middle">평가 A</text><text x="415.0" y="187.5" class="sub" text-anchor="middle">S의 endpoint 사용</text><rect x="330" y="295" width="170" height="80" rx="9" class="owned" stroke-width="1.4"/><text x="415.0" y="327.5" class="label" text-anchor="middle">평가 B</text><text x="415.0" y="357.5" class="sub" text-anchor="middle">S의 endpoint 사용</text><rect x="610" y="125" width="160" height="80" rx="9" class="engine" stroke-width="1.4"/><text x="690.0" y="157.5" class="label" text-anchor="middle">후속 C</text><text x="690.0" y="187.5" class="sub" text-anchor="middle">A 결과 사용</text><path d="M220 252 H270 V165 H330" class="line" marker-end="url(#arrow)" /><path d="M270 252 V335 H330" class="line" marker-end="url(#arrow)" /><circle cx="270" cy="252" r="3" fill="#506779"/><path d="M500 165 H610" class="line" marker-end="url(#arrow)" /><text x="555" y="147" class="edge" text-anchor="middle">A 성공</text><text x="590" y="323" class="sub" text-anchor="middle">A가 실패해도</text><text x="590" y="346" class="sub" text-anchor="middle">B는 계속 실행</text></svg>