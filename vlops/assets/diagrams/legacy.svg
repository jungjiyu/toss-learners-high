<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title desc"><title id="title">Kafka·Airflow 기반 실행 구조</title><desc id="desc">요청은 Kafka와 Airflow Sensor를 거쳐 VLOps 콜백으로 전달된다. 콜백은 Kafka에서 선행 상태를 조회하고 Controller로 GPU 작업을 생성한다. 원격 작업의 상태와 출력은 Kafka로 돌아온다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="800" height="610" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">01  LEGACY</text><text x="28" y="64" class="title" text-anchor="start">Kafka·Airflow의 요청·상태 흐름</text><rect x="450" y="100" width="320" height="130" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="468" y="126" class="group-label" text-anchor="start">AIRFLOW</text><rect x="450" y="275" width="320" height="280" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="468" y="301" class="group-label" text-anchor="start">VLOps 실행 코드</text><rect x="35" y="125" width="195" height="76" rx="9" class="neutral" stroke-width="1.4"/><text x="132.5" y="155.5" class="label" text-anchor="middle">요청 스크립트</text><text x="132.5" y="185.5" class="sub" text-anchor="middle">서빙 · 평가 요청</text><rect x="35" y="280" width="195" height="95" rx="9" class="engine" stroke-width="1.4"/><text x="132.5" y="320.0" class="label" text-anchor="middle">Kafka</text><text x="132.5" y="350.0" class="sub" text-anchor="middle">요청 · 상태 · 출력</text><rect x="480" y="145" width="260" height="65" rx="9" class="engine" stroke-width="1.4"/><text x="610.0" y="170.0" class="label" text-anchor="middle">Sensor</text><text x="610.0" y="200.0" class="sub" text-anchor="middle">요청 감지</text><rect x="480" y="320" width="260" height="80" rx="9" class="owned" stroke-width="1.4"/><text x="610.0" y="352.5" class="label" text-anchor="middle">콜백</text><text x="610.0" y="382.5" class="sub" text-anchor="middle">선행 상태 확인</text><rect x="480" y="465" width="260" height="65" rx="9" class="owned" stroke-width="1.4"/><text x="610.0" y="490.0" class="label" text-anchor="middle">Controller</text><text x="610.0" y="520.0" class="sub" text-anchor="middle">실행 명령 구성</text><rect x="35" y="465" width="225" height="65" rx="9" class="neutral" stroke-width="1.4"/><text x="147.5" y="490.0" class="label" text-anchor="middle">GPU 작업</text><text x="147.5" y="520.0" class="sub" text-anchor="middle">서빙 · 평가</text><path d="M132 201 V280" class="line" marker-end="url(#arrow)" /><text x="144" y="245" class="edge" text-anchor="start">발행</text><path d="M230 300 H340 V178 H480" class="line" marker-end="url(#arrow)" /><text x="405" y="162" class="edge" text-anchor="middle">요청 감지</text><path d="M610 210 V320" class="line" marker-end="url(#arrow)" /><text x="624" y="260" class="edge" text-anchor="start">콜백 호출</text><path d="M480 355 H230" class="line data" marker-end="url(#arrow)" /><text x="355" y="342" class="edge" text-anchor="middle">선행 상태·출력 조회</text><text x="355" y="384" class="sub" text-anchor="middle">대기 시 pending 재발행</text><path d="M610 400 V465" class="line" marker-end="url(#arrow)" /><text x="624" y="440" class="edge" text-anchor="start">준비 완료 + URL</text><path d="M480 498 H260" class="line" marker-end="url(#arrow)" /><text x="370" y="481" class="edge" text-anchor="middle">Run 생성</text><path d="M147 465 V375" class="line data" marker-end="url(#arrow)" /><text x="163" y="418" class="edge" text-anchor="start">상태·출력 발행</text><path d="M35 583 H65" class="line"/><path d="M250 583 H280" class="line data"/><text x="75" y="589" class="sub" text-anchor="start">요청·실행 호출</text><text x="290" y="589" class="sub" text-anchor="start">상태 조회·기록</text></svg>