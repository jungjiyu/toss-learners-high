<svg xmlns="http://www.w3.org/2000/svg" width="400" height="496" viewBox="0 0 400 496" role="img" aria-labelledby="title"><title id="title">Run 80의 앞부분 검증은 마지막 누락을 확인하지 못했다</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="400" height="496" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="24" y="38" font-size="22" font-weight="700" text-anchor="start">Run 80: 서로 다른 두 검증</text><text x="24" y="91" font-size="19" font-weight="650" text-anchor="start">재접속 검증</text><text x="24" y="120" font-size="17" font-weight="400" text-anchor="start">이미 전달한 앞 196개를 대조</text><rect x="24" y="139" width="352" height="54" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="200" y="173" font-size="19" font-weight="650" text-anchor="middle">앞 196개 레코드 일치</text><text x="24" y="225" font-size="16" font-weight="400" text-anchor="start">아직 받지 못한 끝부분은 비교할 수 없음</text><text x="24" y="288" font-size="19" font-weight="650" text-anchor="start">종료 후 전체 대조</text><text x="24" y="318" font-size="17" font-weight="400" text-anchor="start">기준본 523줄과 최종 출력을 비교</text><rect x="24" y="338" width="268" height="54" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><rect x="300" y="338" width="76" height="54" rx="10" fill="#fff0e9" stroke="#dfad95"/><text x="158" y="372" font-size="18" font-weight="650" text-anchor="middle">앞 517줄 일치</text><text x="338" y="372" font-size="18" font-weight="650" text-anchor="middle" fill="#9a4b30">6줄</text><text x="376" y="424" font-size="17" font-weight="600" text-anchor="end" fill="#9a4b30">마지막 구간 누락</text><text x="24" y="472" font-size="14" font-weight="400" text-anchor="start">구간 너비는 로그 수의 비율과 무관하다.</text></g></svg>