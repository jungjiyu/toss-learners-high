<svg xmlns="http://www.w3.org/2000/svg" width="800" height="422" viewBox="0 0 800 422" role="img" aria-labelledby="title"><title id="title">Run 80의 앞부분 검증과 전체 비교</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="800" height="422" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="30" y="40" font-size="22" font-weight="700" text-anchor="start">Run 80: 재접속 성공과 전체 로그 일치는 별개</text><text x="30" y="87" font-size="19" font-weight="650" text-anchor="start">재접속 검증</text><text x="30" y="115" font-size="17" font-weight="400" text-anchor="start">이미 전달한 앞 196개 레코드의 순서·내용 확인</text><rect x="30" y="134" width="280" height="48" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="170" y="165" font-size="18" font-weight="650" text-anchor="middle">앞 196개 일치</text><text x="335" y="165" font-size="17" font-weight="400" text-anchor="start">이후 로그의 완전성은 검사 범위 밖</text><text x="30" y="231" font-size="19" font-weight="650" text-anchor="start">종료 후 전체 대조</text><text x="30" y="260" font-size="17" font-weight="400" text-anchor="start">기준본 523줄과 follow 최종 출력을 바이트 단위로 비교</text><rect x="30" y="279" width="670" height="48" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><rect x="704" y="279" width="66" height="48" rx="10" fill="#fff0e9" stroke="#dfad95"/><text x="365" y="310" font-size="18" font-weight="650" text-anchor="middle">앞 517줄 일치</text><text x="737" y="310" font-size="17" font-weight="650" text-anchor="middle" fill="#9a4b30">6줄</text><text x="770" y="357" font-size="17" font-weight="600" text-anchor="end" fill="#9a4b30">마지막 구간 누락</text><text x="30" y="393" font-size="14" font-weight="400" text-anchor="start">구간을 설명하기 위한 도식으로, 너비는 로그 수의 비율과 무관하다.</text></g></svg>