<svg xmlns="http://www.w3.org/2000/svg" width="400" height="676" viewBox="0 0 400 676" role="img" aria-labelledby="title"><title id="title">생성 전 표식 저장부터 기존 GPU 작업 재연결까지</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="400" height="676" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="24" y="38" font-size="22" font-weight="700" text-anchor="start">응답을 잃은 뒤의 재연결</text><rect x="24" y="66" width="352" height="82" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="200.0" y="96" font-size="19" font-weight="650" text-anchor="middle">1. VLOps DB에 표식 저장</text><text x="200.0" y="123" font-size="16" font-weight="400" text-anchor="middle">원격 생성 전에 자원 ID 확정</text><path d="M200 148V182" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="192" width="352" height="100" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="200.0" y="222" font-size="19" font-weight="650" text-anchor="middle">2. 표식을 넣어 GPU 작업 생성</text><text x="200.0" y="249" font-size="16" font-weight="400" text-anchor="middle">원격 작업은 생성됨</text><text x="200.0" y="273" font-size="16" font-weight="400" text-anchor="middle">생성 응답은 전달되지 않음</text><path d="M200 292V332" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="342" width="352" height="82" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="200.0" y="372" font-size="19" font-weight="650" text-anchor="middle">3. 같은 표식으로 목록 조회</text><text x="200.0" y="399" font-size="16" font-weight="400" text-anchor="middle">생성 API를 바로 반복하지 않음</text><path d="M200 424V458" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="468" width="352" height="82" rx="10" fill="#edf6f2" stroke="#bdd5c9"/><text x="200.0" y="498" font-size="19" font-weight="650" text-anchor="middle">4. 기존 Run ID로 이어가기</text><text x="200.0" y="525" font-size="16" font-weight="400" text-anchor="middle">찾은 원격 ID를 DB에 저장</text><text x="24" y="600" font-size="17" font-weight="500" text-anchor="start">끝까지 생성 여부가 불명확하면</text><text x="24" y="629" font-size="16" font-weight="400" text-anchor="start">확인 과정에서 재생성하지 않고 오류 반환</text></g></svg>