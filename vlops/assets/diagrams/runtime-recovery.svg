<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title"><title id="title">GPU 작업 생성 응답 유실과 기존 작업 검색</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607987"/></marker></defs><rect width="800" height="490" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#243d48"><text x="30" y="40" font-size="22" font-weight="700" text-anchor="start">생성 응답이 없어도 같은 작업을 찾는 과정</text><rect x="30" y="65" width="200" height="48" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="130" y="96" font-size="19" font-weight="650" text-anchor="middle">VLOps DB</text><path d="M130 113V452" stroke="#d6e0e6" stroke-width="2" stroke-dasharray="5 5"/><rect x="300" y="65" width="200" height="48" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="400" y="96" font-size="19" font-weight="650" text-anchor="middle">실행 워커</text><path d="M400 113V452" stroke="#d6e0e6" stroke-width="2" stroke-dasharray="5 5"/><rect x="570" y="65" width="200" height="48" rx="10" fill="#eef3f7" stroke="#c4d4de"/><text x="670" y="96" font-size="19" font-weight="650" text-anchor="middle">GPU 플랫폼</text><path d="M670 113V452" stroke="#d6e0e6" stroke-width="2" stroke-dasharray="5 5"/><text x="265" y="149" font-size="17" font-weight="500" text-anchor="middle">① 생성 전 표식 저장</text><path d="M400 163H130" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="207" font-size="17" font-weight="500" text-anchor="middle">② 표식을 넣어 생성 요청</text><path d="M400 221H670" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="264" font-size="17" font-weight="500" text-anchor="middle" fill="#9a4b30">③ 생성됐지만 응답 유실</text><path d="M670 278H455" fill="none" stroke="#607987" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="425" y="285" font-size="27" font-wei