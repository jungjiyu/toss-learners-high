<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc"><title id="title">Temporal 실행 구조 · 모바일</title><desc id="desc">Control Server가 버전과 실행을 DB에 저장한다. Temporal과 Worker가 작업과 이력을 교환한다. Workflow는 DAG를 제어하고 Activity는 DB와 GPU 환경을 호출한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="400" height="800" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">03  TEMPORAL</text><text x="28" y="64" class="title" text-anchor="start">Temporal과 VLOps Worker</text><rect x="20" y="445" width="360" height="185" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="38" y="471" class="group-label" text-anchor="start">VLOps WORKER</text><rect x="210" y="693" width="180" height="95" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="228" y="719" class="group-label" text-anchor="start">GPU</text><rect x="20" y="115" width="175" height="90" rx="9" class="owned" stroke-width="1.4"/><text x="107.5" y="152.5" class="label" text-anchor="middle">Control Server</text><text x="107.5" y="182.5" class="sub" text-anchor="middle">버전 · 실행 저장</text><rect x="225" y="115" width="155" height="90" rx="9" class="neutral" stroke-width="1.4"/><text x="302.5" y="152.5" class="label" text-anchor="middle">VLOps DB</text><text x="302.5" y="182.5" class="sub" text-anchor="middle">정의 · 실행 상태</text><rect x="20" y="295" width="175" height="85" rx="9" class="engine" stroke-width="1.4"/><text x="107.5" y="330.0" class="label" text-anchor="middle">Temporal</text><text x="107.5" y="360.0" class="sub" text-anchor="middle">실행 이력 · 재시도</text><rect x="37" y="495" width="150" height="90" rx="9" class="owned" stroke-width="1.4"/><text x="112.0" y="532.5" class="label" text-anchor="middle">Workflow</text><text x="112.0" y="562.5" class="sub" text-anchor="middle">다음 task 선택</text><rect x="225" y="495" width="138" height="90" rx="9" class="owned" stroke-width="1.4"/><text x="294.0" y="532.5" class="label" text-anchor="middle">Activity</text><text x="294.0" y="562.5" class="sub" text-anchor="middle">외부 API 호출</text><rect x="225" y="734" width="150" height="40" rx="9" class="neutral" stroke-width="1.4"/><text x="300.0" y="761.0" class="label" text-anchor="middle">GPU 작업</text><path d="M195 160 H225" class="line" marker-end="url(#arrow)" /><path d="M107 205 V295" class="line" marker-end="url(#arrow)" /><text x="120" y="257" class="edge" text-anchor="start">실행 ID</text><path d="M107 380 V445" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="124" y="420" class="edge" text-anchor="start">작업·이력</text><path d="M187 540 H225" class="line" marker-end="url(#arrow)" /><path d="M296 495 V205" class="line data" marker-end="url(#arrow)" /><text x="309" y="324" class="edge" text-anchor="start">정의 조회</text><text x="309" y="347" class="edge" text-anchor="start">상태 저장</text><path d="M296 585 V734" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="310" y="670" class="edge" text-anchor="start">Run API<