<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc"><title id="title">Temporal 최종 실행 구조</title><desc id="desc">Control Server는 정의 버전과 실행을 저장한다. Temporal은 Worker와 작업·이력을 주고받는다. Worker의 Workflow 코드가 DAG를 진행하며 Activity가 DB와 원격 GPU 플랫폼을 호출한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="800" height="640" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">03  TEMPORAL</text><text x="28" y="64" class="title" text-anchor="start">Temporal Service와 VLOps Worker</text><rect x="325" y="270" width="445" height="210" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="343" y="296" class="group-label" text-anchor="start">VLOps WORKER</text><rect x="535" y="535" width="235" height="85" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="553" y="561" class="group-label" text-anchor="start">GPU 환경</text><rect x="30" y="120" width="220" height="80" rx="9" class="owned" stroke-width="1.4"/><text x="140.0" y="152.5" class="label" text-anchor="middle">Control Server</text><text x="140.0" y="182.5" class="sub" text-anchor="middle">실행 접수 · 버전 고정</text><rect x="555" y="120" width="215" height="80" rx="9" class="neutral" stroke-width="1.4"/><text x="662.5" y="152.5" class="label" text-anchor="middle">VLOps DB</text><text x="662.5" y="182.5" class="sub" text-anchor="middle">정의 버전 · 실행 상태</text><rect x="30" y="320" width="220" height="95" rx="9" class="engine" stroke-width="1.4"/><text x="140.0" y="360.0" class="label" text-anchor="middle">Temporal Service</text><text x="140.0" y="390.0" class="sub" text-anchor="middle">실행 이력 · 재시도</text><rect x="345" y="330" width="180" height="90" rx="9" class="owned" stroke-width="1.4"/><text x="435.0" y="367.5" class="label" text-anchor="middle">Workflow 코드</text><text x="435.0" y="397.5" class="sub" text-anchor="middle">다음 task 선택</text><rect x="565" y="330" width="185" height="90" rx="9" class="owned" stroke-width="1.4"/><text x="657.5" y="367.5" class="label" text-anchor="middle">Activity</text><text x="657.5" y="397.5" class="sub" text-anchor="middle">DB · 원격 API 호출</text><rect x="555" y="565" width="195" height="40" rx="9" class="neutral" stroke-width="1.4"/><text x="652.5" y="592.0" class="label" text-anchor="middle">GPU 작업</text><path d="M250 160 H555" class="line" marker-end="url(#arrow)" /><text x="402" y="144" class="edge" text-anchor="middle">정의 버전·실행 저장</text><path d="M140 200 V320" class="line" marker-end="url(#arrow)" /><text x="155" y="266" class="edge" text-anchor="start">실행 ID로 시작</text><path d="M250 359 H325" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="296" y="343" class="edge" text-anchor="middle">작업</text><text x="296" y="390" class="sub" text-anchor="middle">이력</text><path d="M525 375 H565" class="line" marker-end="url(#arrow)" /><text x="545" y="451" class="sub" text-anchor="middle">Activity 예약 · Temporal 경유</text><path d="M660 330 V200" class="line data" marker-end="url(#arrow)" /><text x="674"