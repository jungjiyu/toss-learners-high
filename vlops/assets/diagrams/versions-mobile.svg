<svg xmlns="http://www.w3.org/2000/svg" width="400" height="580" viewBox="0 0 400 580" role="img" aria-labelledby="title desc"><title id="title">정의 버전과 실행 · 모바일</title><desc id="desc">기존 실행과 v1을 지정한 새 실행은 v1에 고정된다. 최신 버전으로 시작한 실행은 v2를 참조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="400" height="580" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">DEFINITION / EXECUTION</text><text x="28" y="64" class="title" text-anchor="start">워크플로 정의와 실행 버전</text><rect x="10" y="105" width="180" height="445" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="28" y="131" class="group-label" text-anchor="start">정의 버전</text><rect x="210" y="105" width="180" height="445" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="228" y="131" class="group-label" text-anchor="start">실행</text><rect x="25" y="160" width="150" height="190" rx="9" class="owned" stroke-width="1.4"/><text x="100.0" y="236.5" class="label" text-anchor="middle">v1</text><text x="100.0" y="266.5" class="sub" text-anchor="middle">처음 등록한</text><text x="100.0" y="289.5" class="sub" text-anchor="middle">평가 구성</text><rect x="25" y="435" width="150" height="85" rx="9" class="version" stroke-width="1.4"/><text x="100.0" y="470.0" class="label" text-anchor="middle">v2</text><text x="100.0" y="500.0" class="sub" text-anchor="middle">평가 항목 추가</text><rect x="225" y="160" width="150" height="85" rx="9" class="owned" stroke-width="1.4"/><text x="300.0" y="195.0" class="label" text-anchor="middle">기존 실행</text><text x="300.0" y="225.0" class="sub" text-anchor="middle">v2 등록 전 접수</text><rect x="225" y="300" width="150" height="85" rx="9" class="owned" stroke-width="1.4"/><text x="300.0" y="335.0" class="label" text-anchor="middle">새 실행</text><text x="300.0" y="365.0" class="sub" text-anchor="middle">v1 지정</text><rect x="225" y="435" width="150" height="85" rx="9" class="version" stroke-width="1.4"/><text x="300.0" y="470.0" class="label" text-anchor="middle">새 실행</text><text x="300.0" y="500.0" class="sub" text-anchor="middle">latest 선택</text><path d="M225 202 H175" class="line" marker-end="url(#arrow)" /><text x="200" y="185" class="edge" text-anchor="middle">v1</text><path d="M225 342 H200 V307 H175" class="line" marker-end="url(#arrow)" /><text x="200" y="290" class="edge" text-anchor="middle">v1</text><path d="M225 477 H175" class="line" marker-end="url(#arrow)" /><text x="200" y="460" class="edge" text-anchor="middle">v2</text></svg>