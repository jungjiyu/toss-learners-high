<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">정의 버전과 실행의 연결</title><desc id="desc">같은 워크플로에 v1과 v2를 보관한다. 기존 실행과 v1을 명시한 새 실행은 v1을 참조한다. 최신 버전으로 시작한 새 실행은 v2를 참조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506779" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243746} .title{font-size:21px;font-weight:750;letter-spacing:-.4px}.label{font-size:18px;font-weight:650}.sub{font-size:16px;fill:#526577}.edge{font-size:16px;fill:#435c6e;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:15px;font-weight:650;fill:#687c89;letter-spacing:.2px}.line{fill:none;stroke:#506779;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.data{stroke:#8699a6;stroke-dasharray:5 5}.owned{fill:#edf7f2;stroke:#73a48e}.engine{fill:#edf3ff;stroke:#87a6d0}.neutral{fill:white;stroke:#a6b6c1}.version{fill:#f2effc;stroke:#ac9bd1}</style><rect width="800" height="580" fill="white"/><text x="28" y="32" class="group-label" text-anchor="start">DEFINITION / EXECUTION</text><text x="28" y="64" class="title" text-anchor="start">워크플로 정의와 실행별 버전 참조</text><rect x="30" y="115" width="275" height="425" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="48" y="141" class="group-label" text-anchor="start">같은 워크플로 · 정의 버전</text><rect x="480" y="115" width="290" height="425" rx="12" fill="#f8fafc" stroke="#c8d4dc" stroke-dasharray="5 5"/><text x="498" y="141" class="group-label" text-anchor="start">실행별로 고정한 계획</text><rect x="55" y="170" width="225" height="150" rx="9" class="owned" stroke-width="1.4"/><text x="167.5" y="237.5" class="label" text-anchor="middle">v1</text><text x="167.5" y="267.5" class="sub" text-anchor="middle">처음 등록한 평가 구성</text><rect x="55" y="410" width="225" height="95" rx="9" class="version" stroke-width="1.4"/><text x="167.5" y="450.0" class="label" text-anchor="middle">v2</text><text x="167.5" y="480.0" class="sub" text-anchor="middle">평가 항목 추가</text><rect x="505" y="160" width="240" height="85" rx="9" class="owned" stroke-width="1.4"/><text x="625.0" y="195.0" class="label" text-anchor="middle">기존 실행</text><text x="625.0" y="225.0" class="sub" text-anchor="middle">v2 등록 전 접수</text><rect x="505" y="300" width="240" height="85" rx="9" class="owned" stroke-width="1.4"/><text x="625.0" y="335.0" class="label" text-anchor="middle">새 실행 · v1 지정</text><text x="625.0" y="365.0" class="sub" text-anchor="middle">과거 계획으로 시작</text><rect x="505" y="420" width="240" height="85" rx="9" class="version" stroke-width="1.4"/><text x="625.0" y="455.0" class="label" text-anchor="middle">새 실행 · latest</text><text x="625.0" y="485.0" class="sub" text-anchor="middle">변경된 계획으로 시작</text><path d="M505 202 H280" class="line" marker-end="url(#arrow)" /><text x="392" y="185" class="edge" text-anchor="middle">v1 고정</text><path d="M505 342 H385 V285 H280" class="line" marker-end="url(#arrow)" /><text x="440" y="326" class="edge" text-anchor="middle">v1 고정</text><path d="M505 462 H280" class="line" marker-end="url(#arrow)" /><text x="392" y="445" class="edge" text-anchor="middle">v2 고정</text></svg>